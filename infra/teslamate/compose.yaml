name: tesla-saving-ticket

services:
  teslamate:
    image: teslamate/teslamate:4.1.1
    restart: unless-stopped
    environment:
      ENCRYPTION_KEY: ${TM_ENCRYPTION_KEY}
      DATABASE_USER: teslamate
      DATABASE_PASS: ${TM_DB_PASSWORD}
      DATABASE_NAME: teslamate
      DATABASE_HOST: database
      MQTT_HOST: mosquitto
      TZ: Asia/Shanghai
      # TeslaMate 4.1.1 bundles tzdata 1.1.3. Disable its runtime updater until
      # the image includes tzdata 1.1.4+, which already bundles the 2026b data.
      ERL_FLAGS: "-tzdata autoupdate disabled"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./import:/opt/app/import
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_started

  database:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: teslamate
      POSTGRES_PASSWORD: ${TM_DB_PASSWORD}
      POSTGRES_DB: teslamate
      TZ: Asia/Shanghai
    volumes:
      - teslamate-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teslamate -d teslamate"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  grafana:
    image: teslamate/grafana:4.1.1
    restart: unless-stopped
    environment:
      DATABASE_USER: teslamate
      DATABASE_PASS: ${TM_DB_PASSWORD}
      DATABASE_NAME: teslamate
      DATABASE_HOST: database
      GF_SECURITY_ADMIN_PASSWORD: ${TM_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - teslamate-grafana-data:/var/lib/grafana
    depends_on:
      database:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - mosquitto-conf:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    security_opt:
      - no-new-privileges:true

volumes:
  teslamate-db:
  teslamate-grafana-data:
  mosquitto-conf:
  mosquitto-data:
